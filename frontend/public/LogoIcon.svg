<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hubGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon/Symbol Centered -->
  <g transform="translate(20, 20)">
    <!-- Main hub circle -->
    <circle cx="30" cy="30" r="22" fill="url(#logoGradient)" opacity="0.9"/>
    
    <!-- Connection nodes -->
    <circle cx="8" cy="12" r="8" fill="url(#hubGradient)"/>
    <circle cx="52" cy="12" r="8" fill="url(#hubGradient)"/>
    <circle cx="8" cy="48" r="8" fill="url(#hubGradient)"/>
    <circle cx="52" cy="48" r="8" fill="url(#hubGradient)"/>
    
    <!-- Connection lines -->
    <line x1="16" y1="18" x2="22" y2="24" stroke="#4F46E5" stroke-width="3" opacity="0.7"/>
    <line x1="44" y1="18" x2="38" y2="24" stroke="#4F46E5" stroke-width="3" opacity="0.7"/>
    <line x1="16" y1="42" x2="22" y2="36" stroke="#4F46E5" stroke-width="3" opacity="0.7"/>
    <line x1="44" y1="42" x2="38" y2="36" stroke="#4F46E5" stroke-width="3" opacity="0.7"/>
    
    <!-- Central hub icon -->
    <circle cx="30" cy="30" r="5" fill="white"/>
  </g>
</svg>